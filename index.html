<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craft Profit Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3f7;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 17px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6c4ab6;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .result {
      display: flex;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .result:last-child {
      border-bottom: none;
    }

    .profit {
      font-size: 24px;
      font-weight: bold;
    }

    .good {
      color: #16803c;
    }

    .bad {
      color: #c62828;
    }

    .price {
      background: #f0ebfa;
      padding: 15px;
      border-radius: 12px;
      margin-top: 18px;
    }

    .price strong {
      font-size: 22px;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🧵 Craft Profit Calculator</h1>
  <div class="subtitle">
    Find out what your handmade item really costs.
  </div>

  <div class="card">

    <label for="materials">Materials Cost ($)</label>
    <input id="materials" type="number" min="0" step="0.01" placeholder="Example: 12.50">

    <label for="hours">Hours Worked</label>
    <input id="hours" type="number" min="0" step="0.1" placeholder="Example: 3">

    <label for="wage">Your Hourly Rate ($)</label>
    <input id="wage" type="number" min="0" step="0.01" value="15">

    <label for="price">Selling Price ($)</label>
    <input id="price" type="number" min="0" step="0.01" placeholder="Example: 50">

    <button onclick="calculate()">Calculate My Profit</button>

  </div>

  <div class="card">

    <h2>📊 Your Results</h2>

    <div class="result">
      <span>Material Cost</span>
      <strong id="materialResult">$0.00</strong>
    </div>

    <div class="result">
      <span>Labor Cost</span>
      <strong id="laborResult">$0.00</strong>
    </div>

    <div class="result">
      <span>Total Cost</span>
      <strong id="costResult">$0.00</strong>
    </div>

    <div class="result">
      <span>Selling Price</span>
      <strong id="sellingResult">$0.00</strong>
    </div>

    <div class="result">
      <span>Profit</span>
      <strong id="profitResult" class="profit">$0.00</strong>
    </div>

    <div class="result">
      <span>Profit Margin</span>
      <strong id="marginResult">0%</strong>
    </div>

    <div class="price">
      Suggested minimum price:
      <br>
      <strong id="suggestedPrice">$0.00</strong>
    </div>

  </div>

  <div class="footer">
    Craft Profit Calculator
  </div>

</div>

<script>

function money(amount) {
  return "$" + amount.toFixed(2);
}

function calculate() {

  const materials =
    parseFloat(document.getElementById("materials").value) || 0;

  const hours =
    parseFloat(document.getElementById("hours").value) || 0;

  const wage =
    parseFloat(document.getElementById("wage").value) || 0;

  const price =
    parseFloat(document.getElementById("price").value) || 0;

  const labor = hours * wage;

  const totalCost = materials + labor;

  const profit = price - totalCost;

  const margin = price > 0
    ? (profit / price) * 100
    : 0;

  const suggestedPrice = totalCost * 1.5;

  document.getElementById("materialResult").textContent =
    money(materials);

  document.getElementById("laborResult").textContent =
    money(labor);

  document.getElementById("costResult").textContent =
    money(totalCost);

  document.getElementById("sellingResult").textContent =
    money(price);

  document.getElementById("profitResult").textContent =
    money(profit);

  document.getElementById("marginResult").textContent =
    margin.toFixed(1) + "%";

  document.getElementById("suggestedPrice").textContent =
    money(suggestedPrice);

  const profitElement =
    document.getElementById("profitResult");

  if (profit >= 0) {
    profitElement.className = "profit good";
  } else {
    profitElement.className = "profit bad";
  }
}

</script>

</body>
  </html>
